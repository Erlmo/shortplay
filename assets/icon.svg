<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6F776B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A4F47;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FFD7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C7F1FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="1024" height="1024" rx="180" fill="url(#grad2)"/>

  <!-- 中心圆形背景 -->
  <circle cx="512" cy="512" r="320" fill="url(#grad1)" opacity="0.95"/>

  <!-- 播放按钮三角形 -->
  <path d="M 420 340 L 420 684 L 720 512 Z" fill="white" opacity="0.95"/>

  <!-- 装饰圆环 -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="white" stroke-width="8" opacity="0.3"/>
</svg>
