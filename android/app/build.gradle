plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.shortplay"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.shortplay"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        // Android 单独升到 3.2.1，iOS 继续使用 pubspec.yaml 中的 3.2.0。
        versionName = "3.2.1"
    }

    // 支持 arm64-v8a 和 armeabi-v7a（32 位：老手机和大量电视盒子）。
    // 自研 .so 在 src/main/jniLibs/<abi>/ 下，两个架构都要有。
    //
    // 注意：defaultConfig.ndk.abiFilters 对 Flutter 无效——Flutter 的 gradle
    // 插件会在其后重新注入全部 ABI 的引擎库（libflutter/libapp 等），覆盖掉
    // 过滤。必须用 packagingOptions.jniLibs.excludes，它在打包最后阶段按路径
    // 排除，对所有 .so（含引擎库）都生效。
    //
    // 发布时用 `flutter build apk --split-per-abi` 按架构拆成两个 APK，
    // 各自体积与原来单架构包相当；不拆的话一个包同时含 32/64 位，体积更大。
    // 如需 x86 模拟器，去掉 "**/x86/**" 与 "**/x86_64/**"（还需编译对应 .so）。
    packagingOptions {
        jniLibs {
            excludes += [
                "**/x86/**",
                "**/x86_64/**",
            ]
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // OkHttp powers HttpBridge.httpRange, the range fetcher the native crypto
    // core calls back into. Declared explicitly rather than relying on a
    // transitive copy from media_kit.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Media3 ExoPlayer — NativePlayerPlugin 使用，替代 media_kit 的原生播放器实现
    def media3_version = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
}
